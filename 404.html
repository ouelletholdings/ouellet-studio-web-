<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found | Ouellet Studio</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap">
<style>
  :root{
    --ink:#0E1621; --bone:#EDE6DA; --muted:#8E929B; --champagne:#C9B37E; --zinc:#272A30;
    --font-display:'Cormorant Garamond', Georgia, serif;
    --font-sans:'Manrope', -apple-system, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--ink); color:var(--bone); font-family:var(--font-sans); min-height:100vh; display:flex; align-items:center; justify-content:center; -webkit-font-smoothing:antialiased;}
  .card{max-width:440px; width:100%; margin:24px; padding:48px 36px; text-align:center;}
  .eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:var(--champagne);}
  h1{font-family:var(--font-display); font-weight:500; font-size:56px; margin:14px 0 10px; letter-spacing:0.02em;}
  p{color:var(--muted); font-size:15px; line-height:1.6; margin:0 0 32px;}
  .back{display:inline-flex; align-items:center; justify-content:center; padding:14px 26px; font-family:var(--font-sans); font-size:12px; letter-spacing:0.1em; text-transform:uppercase; background:var(--champagne); color:var(--ink); border:1px solid var(--champagne); text-decoration:none; border-radius:1px;}
  .back:hover{background:transparent; color:var(--champagne);}
  .tag{margin-top:40px; font-family:var(--font-mono); font-size:10px; letter-spacing:0.14em; color:var(--muted); text-transform:uppercase; border-top:1px solid var(--zinc); padding-top:24px;}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">Ouellet Studio</div>
  <h1>404</h1>
  <p>This page doesn't exist, or the link has moved. The page you're after is probably a click away from the homepage.</p>
  <a href="/" class="back">Return Home</a>
  <div class="tag">Light · Material · Motion</div>
</div>
</body>
</html>
